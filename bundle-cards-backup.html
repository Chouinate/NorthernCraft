<!-- ═══════════════════════════════════════════════
     BUNDLE CARDS CSS (restore inside <style>)
     ═══════════════════════════════════════════════

    #bundles { background: var(--cream-dark); }
    .bundles-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .bundle-card {
      background: var(--cream);
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(92, 53, 69, 0.13), 0 2px 10px rgba(92, 53, 69, 0.09);
      display: grid;
      grid-template-rows: auto auto;
    }
    .bundle-card-visual {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 28px;
      padding-bottom: 24px;
    }
    .bundle-card-icon {
      display: block;
      height: auto;
      width: auto;
      max-width: 90%;
      pointer-events: none;
      color: var(--mauve-dark);
    }
    .bundle-card-icon .frame { stroke: var(--wood); stroke-width: 1.5px; fill: none; vector-effect: non-scaling-stroke; }
    .bundle-card-icon .gem   { fill: var(--rose); stroke: none; }
    .bundle-card-badge {
      position: absolute;
      bottom: calc(100% + 3px);
      left: 20px;
      font-family: var(--ff-sans);
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mauve);
      opacity: 0.85;
    }
    .bundle-card-footer {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 20px 36px;
    }
    .bundle-card-name {
      font-family: var(--ff-serif);
      font-size: 20px;
      font-weight: 400;
      color: var(--mauve-dark);
      line-height: 1;
      font-variant-numeric: lining-nums;
    }
    .bundle-card--full-wall .bundle-card-name { color: var(--charcoal); }
    .bundle-card-desc {
      font-size: 11px;
      line-height: 1.6;
      color: var(--mauve-dark);
      opacity: 0.8;
      max-width: 58%;
    }
    .bundle-card-price {
      position: absolute;
      bottom: 14px;
      right: 20px;
      font-family: var(--ff-sans);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--mauve-dark);
      line-height: 1;
    }
    .bundle-card { cursor: pointer; transition: box-shadow 0.2s; }
    .bundle-card:hover { box-shadow: inset 0 0 0 1.5px rgba(92,53,69,0.28), 0 4px 16px rgba(92,53,69,0.12); }
    .bundle-card-save { font-style: normal; font-size: 9px; letter-spacing: 0.1em; opacity: 0.75; }
    .bundles-shipping-note {
      font-family: var(--ff-sans);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    #bundles .section-title { margin-bottom: 6px; }
    @media (pointer: coarse) and (max-width: 900px) {
      #bundles { padding-left: 0 !important; padding-right: 0 !important; }
      #bundles .section-label, #bundles .section-title, #bundles .section-shipping { padding-left: 28px; }
      .bundles-grid {
        grid-template-columns: unset !important;
        grid-template-rows: unset !important;
        display: flex !important;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        gap: 24px;
        align-items: stretch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .bundles-grid::-webkit-scrollbar { display: none; }
      .bundle-card {
        flex: 0 0 calc(70vw - 24px);
        scroll-snap-align: start;
      }
    }
    @media (pointer: fine) and (max-width: 1050px) {
      #bundles {
        overflow-x: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(92,53,69,0.3) transparent;
      }
      #bundles::-webkit-scrollbar { height: 3px; }
      #bundles::-webkit-scrollbar-track { background: transparent; }
      #bundles::-webkit-scrollbar-thumb { background: rgba(92,53,69,0.3); border-radius: 2px; }
      .bundles-grid { grid-template-columns: repeat(4, 220px) !important; }
    }
-->
